[project]
name = "score-audit"
version = "0.1.0"
description = "Audits of benchmark design choices and LLM-judge verdicts"
authors = [
    { name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.23.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
